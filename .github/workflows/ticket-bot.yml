name: ticket-bot
on:
  schedule:
    - cron: "3-58/5 * * * *"  # every 5 min at :03,:08,... (off the busy :00/:05 marks): answer Telegram commands
    - cron: "17 */3 * * *"   # every 3 hours at :17: also check every watch
  workflow_dispatch: {}       # manual run = full check, always sends the 'open till' note
 
concurrency:
  group: ticket-bot           # never run two at once (they share state.json)
  cancel-in-progress: false
 
permissions:
  contents: write             # lets the job commit state.json back
 
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python ticket_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */3 * * *') && 'full' || 'commands' }}
          FORCE_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Save state
        run: |
          git config user.name "ticket-bot"
          git config user.email "ticket-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
 
